name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Memakai google-services.json asli bila secret GOOGLE_SERVICES_JSON diisi.
      # Jika belum, dipakai berkas sementara agar APK tetap bisa dibuat
      # (aplikasi baru berfungsi penuh setelah Firebase asli dipasang).
      - name: Siapkan google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" > app/google-services.json
            echo "Memakai google-services.json dari secret"
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.saifularif.gpstracker" }
                },
                "api_key": [ { "current_key": "placeholder-key" } ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "::warning::Memakai google-services.json sementara. Isi secret GOOGLE_SERVICES_JSON agar login & lokasi berfungsi."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
